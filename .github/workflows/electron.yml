name: Build and Publish Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Electron App (no publish)
        run: pnpm --filter client run electron:ci

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== client/release contents ==="
          find client/release -maxdepth 1 -type f | sort

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          EXE=$(find client/release -maxdepth 1 -name "*.exe" | head -1)
          BLOCKMAP=$(find client/release -maxdepth 1 -name "*.exe.blockmap" | head -1)
          LATESTYML=$(find client/release -maxdepth 1 -name "latest.yml" | head -1)

          echo "EXE: $EXE"
          echo "BLOCKMAP: $BLOCKMAP"
          echo "LATEST.YML: $LATESTYML"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Release $TAG" \
            --draft=false \
            "$EXE" \
            ${BLOCKMAP:+"$BLOCKMAP"} \
            ${LATESTYML:+"$LATESTYML"}
