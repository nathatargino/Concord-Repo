name: Build and Publish Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Sync package version with git tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Syncing package version to $VERSION from tag $TAG"
          node -e "
            const fs = require('fs');
            ['package.json', 'client/package.json'].forEach(file => {
              if (fs.existsSync(file)) {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = '$VERSION';
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
                console.log('Updated ' + file + ' to version ' + '$VERSION');
              }
            });
          "

      - name: Setup Python for Widevine VMP Signing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Castlabs EVS Tool
        run: pip install castlabs-evs

      - name: Build Electron App (no publish)
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME || 'concord' }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD || 'Chosen@123' }}
        run: pnpm --filter client run electron:ci

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== client/release contents ==="
          find client/release -maxdepth 1 -type f | sort

      - name: Create GitHub Release (sem assets)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Release $TAG" \
            --draft=false

      - name: Upload release assets (com retry)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}

          upload_with_retry() {
            local FILE="$1"
            local MAX=3
            local N=0
            until gh release upload "$TAG" "$FILE" --clobber; do
              N=$((N+1))
              if [ $N -ge $MAX ]; then
                echo "ERRO: falha ao enviar $FILE após $MAX tentativas"
                exit 1
              fi
              echo "Tentativa $N falhou, aguardando 15s..."
              sleep 15
            done
            echo "Upload de $FILE concluído com sucesso!"
          }

          EXE=$(find client/release -maxdepth 1 -name "*.exe" | head -1)
          BLOCKMAP=$(find client/release -maxdepth 1 -name "*.exe.blockmap" | head -1)
          LATESTYML=$(find client/release -maxdepth 1 -name "latest.yml" | head -1)

          echo "EXE: $EXE"
          echo "BLOCKMAP: $BLOCKMAP"
          echo "LATEST.YML: $LATESTYML"

          [ -n "$EXE" ]       && upload_with_retry "$EXE"
          [ -n "$BLOCKMAP" ]  && upload_with_retry "$BLOCKMAP"
          [ -n "$LATESTYML" ] && upload_with_retry "$LATESTYML"
