name: Build and Publish Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install

      - name: Build Electron App (without publishing)
        run: pnpm --filter client run electron:build -- --publish never

      - name: Create single GitHub Release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$TAG" \
            --draft=false \
            client/release/Concord-Setup.exe \
            client/release/Concord-Setup.exe.blockmap \
            client/release/latest.yml
